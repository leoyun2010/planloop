<script src="_wf.js"></script>
<script>
/* 집회 설정값 — 안내문과 대조한다 (POL-046) */
const CONF = { fee: 80000, account: '국민 000000-00-000000' };

let GUIDES = [
  { order: 1, title: '참가비 · 입금 계좌', visible: true, mentionsFee: true, fee: 80000, account: '국민 000000-00-000000',
    body: '참가비는 <b>80,000원</b>입니다.<br>입금 계좌 · <b>국민 000000-00-000000</b> (예금주 OOO)<br>입금자명은 <b>신청자 이름</b>으로 보내 주세요.<br><br>입금 확인까지 2~3일 정도 걸릴 수 있습니다.' },
  { order: 2, title: '성경책 구매 안내', visible: true,
    body: '성경책은 접수처 옆 판매대에서 구매하실 수 있습니다.<br>집회 기간 중 08:00 ~ 20:00 운영합니다.' },
  { order: 3, title: '숙소 위치 · 준비물', visible: true,
    body: '숙소는 집회장에서 도보 5분 거리입니다.<br>세면도구와 수건은 각자 준비해 주세요.<br>숙소는 집회 1~2일 전에 일괄 배정되며, 배정되면 마이페이지에서 확인하실 수 있습니다.' },
  { order: 4, title: '자주 묻는 질문', visible: true,
    body: '<b>Q. 현장에서 신청할 수 있나요?</b><br>현장 접수는 받지 않습니다. 온라인으로 미리 신청해 주세요.<br><br><b>Q. 입금했는데 왜 아직 확인이 안 되나요?</b><br>은행 내역을 모아서 확인하기 때문에 2~3일 걸릴 수 있습니다.<br><br><b>Q. 지인과 같은 방을 쓸 수 있나요?</b><br>함께 신청하신 동행자는 같은 방으로 배정합니다. 그 외 지인과 가까운 자리는 확약해 드리기 어렵습니다.' },
];
let openSet = new Set([0]);

function render() {
  const vis = GUIDES.filter(g => g.visible).sort((a, b) => a.order - b.order);
  const el = document.getElementById('guideList');
  if (!vis.length) { el.innerHTML = `<div class="empty">아직 등록된 안내문이 없습니다.</div>`; return; }
  el.innerHTML = vis.map((g, i) => `
    <div class="u-card" style="padding:0;overflow:hidden">
      <div style="padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleG(${i})">
        <b style="font-size:16px">${g.title}</b>
        <span style="color:#888">${openSet.has(i) ? '▾' : '›'}</span>
      </div>
      <div class="${openSet.has(i) ? '' : 'hidden'}" style="padding:0 14px 14px;font-size:15px;color:#444;line-height:1.9;border-top:1px solid #eee">
        <div style="padding-top:12px">${g.body}</div>
      </div>
    </div>`).join('');
}
function toggleG(i) { openSet.has(i) ? openSet.delete(i) : openSet.add(i); render(); }

function hideAll() {
  GUIDES.forEach(g => g.visible = false);
  render();
  toast('관리자가 모두 비표시로 바꾼 상태입니다. 빈 화면 대신 안내가 표시됩니다. (POL-046)', 4000);
}

/* POL-046 — 안내문의 참가비·계좌가 집회 설정과 다르면 관리자에게 경고 */
function mismatch() {
  const g = GUIDES[0];
  g.account = '농협 111111-11-111111';
  g.body = g.body.replace('국민 000000-00-000000', '농협 111111-11-111111');
  render();
  const ok = g.fee === CONF.fee && g.account === CONF.account;
  toast(ok ? '설정값과 일치합니다.'
    : '안내문에 적힌 계좌가 집회 설정과 다릅니다 → 관리자 화면(SCR-023)에 경고가 뜹니다. 사용자 화면에는 경고를 노출하지 않습니다. (POL-046)', 5000);
}
render();
</script>
